<style>
:root{
  --page:#e8dcef; --page-2:#dfd0e9; --ink:#2b1b2b;
  --wood:#8a5230; --wood-hi:#a8683c; --wood-ink:#fff4dc; --wood-muted:#f2cfa4;

}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --page:#211523; --page-2:#29192c; --ink:#f6e6d6; --wood:#7a4628; --wood-hi:#94592f; --wood-muted:#e8c298; --line:#140c15; color-scheme: dark; } }
:root[data-theme="dark"]{ --page:#211523; --page-2:#29192c; --ink:#f6e6d6; --wood:#7a4628; --wood-hi:#94592f; --wood-muted:#e8c298; --line:#140c15; color-scheme: dark; }
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;color:var(--ink);background-color:var(--page);background-image:repeating-conic-gradient(var(--page) 0 25%,var(--page-2) 0 50%);background-size:32px 32px;
  font-family:'Pixelify Sans',ui-monospace,Menlo,Consolas,monospace;font-size:15px;line-height:1.3;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--butter);outline-offset:2px}
img{image-rendering:pixelated;image-rendering:crisp-edges}
.ico{vertical-align:middle;image-rendering:pixelated}
.chamfer{clip-path:polygon(4px 0,calc(100% - 4px) 0,100% 4px,100% calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,0 calc(100% - 4px),0 4px)}
[hidden]{display:none!important}
#app{height:100%;display:flex;flex-direction:column;gap:10px;padding:10px 16px 12px}
.panel{position:relative;background-color:var(--wood);color:var(--wood-ink);background-image:repeating-linear-gradient(180deg,transparent 0 .9em,rgba(0,0,0,.12) .9em calc(.9em + 2px));border:3px solid var(--line);box-shadow:inset 0 3px 0 var(--wood-hi),inset 0 -5px 0 rgba(0,0,0,.18)}
.panel.nails::before,.panel.nails::after{content:"";position:absolute;top:.45em;width:5px;height:5px;background:var(--line);box-shadow:inset 1px 1px 0 rgba(255,255,255,.35)}
.panel.nails::before{left:.45em}.panel.nails::after{right:.45em}
#hud{display:flex;align-items:center;flex-wrap:wrap;gap:.45em .55em;padding:.45em 1.4em .55em}
.brand{font-weight:700;font-size:1.5em;line-height:1;color:var(--butter);margin-right:.2em;text-shadow:2px 0 0 var(--line),-2px 0 0 var(--line),0 2px 0 var(--line),0 -2px 0 var(--line),2px 2px 0 var(--line),-2px 2px 0 var(--line),2px -2px 0 var(--line),-2px -2px 0 var(--line),0 4px 0 var(--line)}

@media (max-width:1300px){#hud{font-size:.86em}#hud .chip{padding-left:.25em;padding-right:.35em}}

.sp{flex:1}

#speed{display:inline-flex;gap:.25em}
#soundBtn .off{display:none}#soundBtn.muted .on{display:none}#soundBtn.muted .off{display:block}
#main{flex:1;min-height:0;display:flex;gap:14px}

#wrap{position:absolute;inset:0;overflow:hidden;background:#2b1b2b}

.otext{text-shadow:2px 0 0 #2b1b2b,-2px 0 0 #2b1b2b,0 2px 0 #2b1b2b,0 -2px 0 #2b1b2b,2px 2px 0 #2b1b2b,-2px 2px 0 #2b1b2b,2px -2px 0 #2b1b2b,-2px -2px 0 #2b1b2b,0 4px 0 #2b1b2b}
#banner{position:absolute;left:0;right:0;top:22%;text-align:center;pointer-events:none;z-index:4;opacity:0;color:#fff;padding:0 1em}
#banner .b1{font-size:2em;font-weight:700;color:var(--butter);text-wrap:balance}
#banner .b2{font-size:1em;margin-top:.3em;color:#fff4dc;text-wrap:balance}
#banner.show{animation:bannerA 2.7s ease-out forwards}
#toast{position:absolute;left:50%;bottom:9%;width:max-content;max-width:92%;text-align:center;font-weight:700;color:#fff;pointer-events:none;z-index:4;opacity:0;transform:translateX(-50%)}

@keyframes bannerA{0%{opacity:0;transform:translateY(-.6em) scale(.9)}10%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-.3em)}}

#side{width:370px;flex:none;display:flex;flex-direction:column;min-height:0;padding:.55em .55em .7em}
#tabs{display:flex;flex-wrap:wrap;gap:.3em;padding:0 .1em .5em}

#tabs button.ping::after{content:"";position:absolute;right:3px;top:3px;width:7px;height:7px;background:var(--butter);box-shadow:0 0 0 2px var(--line);animation:pulse .6s steps(2) infinite}

#pane{flex:1;min-height:0;overflow-y:auto;background:var(--paper);color:var(--paper-ink);border:3px solid var(--line);padding:.7em .8em 1em;background-image:repeating-linear-gradient(180deg,transparent 0 1.45em,rgba(138,82,48,.08) 1.45em calc(1.45em + 1px))}

.wishes{margin-bottom:.7em}
.link-row{width:100%;text-align:left;background:none;border:0;border-bottom:1px dashed rgba(43,27,43,.2);cursor:pointer;font:inherit;color:inherit;padding:.3em .1em}

.wish{display:grid;grid-template-columns:1fr auto auto;gap:.5em;align-items:center;padding:.25em 0;border-bottom:1px dashed rgba(43,27,43,.2)}

.lines{display:flex;flex-wrap:wrap;gap:.3em;margin:.4em 0}

.chart{margin:.6em 0 .9em}.ctitle{display:flex;justify-content:space-between;align-items:baseline;gap:.5em}.ctitle small{color:var(--paper-muted);font-size:.8em}
.clegend{display:flex;gap:.8em;font-size:.82em;margin:.2em 0}.chartimg{width:100%;height:auto;image-rendering:auto;border:2px solid var(--line);background:#fff4dc}
.ctable{width:100%;border-collapse:collapse;font-size:.85em;font-variant-numeric:tabular-nums}.ctable th,.ctable td{border-bottom:1px dashed #e0c8a4;padding:.15em .3em;text-align:right}.ctable th{color:var(--paper-muted);font-weight:600}.dbg .link-row small{margin:0}
@media (max-width:900px){
  body{overflow:auto}
  #app{height:auto;min-height:100%}
  #main{flex-direction:column}
  #view{flex:none;height:min(110vw,58vh);min-height:260px}
  #side{width:auto}
  #pane{overflow:visible;flex:none}
  #tut{font-size:.72em;max-width:88%}
  #minimap{width:96px}
}
@media (max-width:520px){ #minimap{width:72px;max-height:60px} #tut{max-width:94%} }
@media (prefers-reduced-motion:reduce){#banner.show,#toast.show{animation-duration:3s}#tabs button.ping::after,.tut-hl{animation:none}}
</style>
</head>
<body>
<div id="app">
  <header id="hud" class="panel nails chamfer">
    <span class="brand">Drobečkov</span><span id="townName"></span>
    <span class="chip" id="dateChip" title="Sezóna, den a čas"><img id="seasonIco" class="ico" alt=""><span id="date"></span><b id="clock"></b><img id="wxIco" class="ico" alt="" hidden></span>
    <span class="chip" title="Mince"><img id="coinIco" class="ico" alt=""><b id="coins">0</b></span>
    <span class="chip" title="Dřevo ve skladu"><img id="woodIco" class="ico" alt=""><b id="wood">0</b></span>
    <span class="chip" title="Místo ve skladech"><img id="boxIco" class="ico" alt=""><b id="store">0/0</b></span>
    <span class="chip" title="Útulnost — přitahuje nové kočky"><img id="cozyIco" class="ico" alt=""><b id="cozy">0</b></span>
    <span class="chip" title="Kočky"><img id="catIco" class="ico" alt=""><b id="catsN">0</b></span>
    <span class="chip" id="powerChip" title="Proud pro automatické stroje" hidden><img id="boltIco" class="ico" alt=""><b id="power">0</b></span>
    <span class="chip" id="fcChip" title="Předpověď na zítřek (satelit)" hidden>zítra <img id="fcIco" class="ico" alt=""></span>
    <button class="sq chamfer" id="landBtn" title="Kupovat pozemky (L)">Pozemky</button>
    <button class="sq chamfer" id="heatBtn" title="Přehledy přes mapu (H)">Přehledy</button>
    <span class="sp"></span>
    <span id="speed" role="group" aria-label="Rychlost času">
      <button class="sq chamfer" data-speed="0" aria-label="Pauza"><svg viewBox="0 0 7 7"><rect x="1" y="1" width="2" height="5"/><rect x="4" y="1" width="2" height="5"/></svg></button>
      <button class="sq chamfer on" data-speed="1" aria-label="Normální rychlost"><svg viewBox="0 0 7 7"><rect x="2" y="1" width="1" height="5"/><rect x="3" y="2" width="1" height="3"/><rect x="4" y="3" width="1" height="1"/></svg></button>
      <button class="sq chamfer" data-speed="2" aria-label="Dvojnásobná rychlost"><svg viewBox="0 0 9 7"><rect x="1" y="1" width="1" height="5"/><rect x="2" y="2" width="1" height="3"/><rect x="3" y="3" width="1" height="1"/><rect x="5" y="1" width="1" height="5"/><rect x="6" y="2" width="1" height="3"/><rect x="7" y="3" width="1" height="1"/></svg></button>
      <button class="sq chamfer" data-speed="4" aria-label="Čtyřnásobná rychlost"><svg viewBox="0 0 12 7"><rect x="0" y="1" width="1" height="5"/><rect x="1" y="2" width="1" height="3"/><rect x="2" y="3" width="1" height="1"/><rect x="4" y="1" width="1" height="5"/><rect x="5" y="2" width="1" height="3"/><rect x="6" y="3" width="1" height="1"/><rect x="8" y="1" width="1" height="5"/><rect x="9" y="2" width="1" height="3"/><rect x="10" y="3" width="1" height="1"/></svg></button>
    </span>
    <button class="sq chamfer" id="soundBtn" aria-label="Zvuk">
      <svg class="on" viewBox="0 0 9 7"><rect x="0" y="2" width="2" height="3"/><rect x="2" y="1" width="1" height="5"/><rect x="3" y="0" width="1" height="7"/><rect x="5" y="2" width="1" height="3"/><rect x="7" y="1" width="1" height="5"/></svg>
      <svg class="off" viewBox="0 0 9 7"><rect x="0" y="2" width="2" height="3"/><rect x="2" y="1" width="1" height="5"/><rect x="3" y="0" width="1" height="7"/><rect x="5" y="2" width="1" height="1"/><rect x="7" y="2" width="1" height="1"/><rect x="6" y="3" width="1" height="1"/><rect x="5" y="4" width="1" height="1"/><rect x="7" y="4" width="1" height="1"/></svg>
    </button>
    <button class="sq chamfer" id="menuBtn" aria-label="Menu">Menu</button>
  </header>
  <main id="main">
    <section id="view">
      <div id="wrap">
        <canvas id="game" aria-label="Údolí"></canvas>
        <canvas id="minimap" width="8" height="8" aria-label="Minimapa"></canvas>
        <div id="tut" class="panel chamfer" hidden></div>
        <div id="banner" class="otext"><div class="b1"></div><div class="b2"></div></div>
        <div id="toast" class="otext"></div>
        <div id="tip" class="tip" hidden></div>
        <div id="advice" class="panel chamfer" role="status" hidden></div>
      </div>
    </section>
    <aside id="side" class="panel chamfer">
      <nav id="tabs">
        <button data-tab="build">Stavět</button>
        <button data-tab="orders">Zakázky</button>
        <button data-tab="cats">Kočky</button>
        <button data-tab="store">Sklad</button>
        <button data-tab="trade">Obchod</button>
        <button data-tab="research">Výzkum</button>
        <button data-tab="help">Příručka</button>
      </nav>
      <div id="pane"></div>
    </aside>
  </main>
</div>
<div id="menu" hidden></div>
